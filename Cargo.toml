[package]
name = "eglass"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "eglass"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
raw-window-handle = "0.6"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
