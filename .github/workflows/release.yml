name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY: eglass.exe

jobs:
  release:
    runs-on: windows-latest

    # Exactly one signing path is selected, in this priority order:
    # SignPath (free for OSS) > Azure Trusted Signing > PFX certificate.
    # With no secrets configured the build still succeeds, unsigned.
    env:
      SIGN_SIGNPATH: ${{ secrets.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGN_AZURE: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
      SIGN_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "tag v$tag does not match Cargo.toml version $version"
          }
          Write-Host "version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/$env:BINARY" "dist/$env:BINARY"
          Get-Item "dist/$env:BINARY" | Select-Object Name, Length

      # --- Signing ------------------------------------------------------
      # Signing must be the last thing that touches the binary: every byte
      # change invalidates the Authenticode hash.

      - name: Upload unsigned artifact for SignPath
        id: upload
        if: env.SIGN_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath (OSS)
        if: env.SIGN_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: ${{ secrets.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Sign with Azure Trusted Signing
        if: env.SIGN_AZURE == 'true' && env.SIGN_SIGNPATH != 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          description: Eagle Glass
          description-url: https://github.com/gaultpeter/eagle-glass-friends

      - name: Sign with PFX certificate
        if: env.SIGN_PFX == 'true' && env.SIGN_SIGNPATH != 'true' && env.SIGN_AZURE != 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 "dist/$env:BINARY" -RequireSignature

      # --- Verify and publish -------------------------------------------

      - name: Verify packaging and signature
        shell: pwsh
        env:
          EXPECT_SIGNATURE: ${{ env.SIGN_SIGNPATH == 'true' || env.SIGN_AZURE == 'true' || env.SIGN_PFX == 'true' }}
        run: |
          $verifyParams = @{ Path = "dist/$env:BINARY"; SumsPath = 'dist/SHA256SUMS.txt' }
          if ($env:EXPECT_SIGNATURE -eq 'true') { $verifyParams.RequireSignature = $true }
          ./scripts/verify-release.ps1 @verifyParams

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eglass.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Built from `${{ github.sha }}` by GitHub Actions.

            **Verify before running:**

            ```powershell
            Get-FileHash .\eglass.exe -Algorithm SHA256
            Get-AuthenticodeSignature .\eglass.exe
            ```

            The SHA-256 must match `SHA256SUMS.txt`.
            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).
